
<div class="wrapper">
  <div class="toolbar">
    <div class="left" #toolbarLeft></div>
    <div class="right" #toolbarRight>
      <button (click)="togglePreview()" class="previewBtn" title="Preview">
        @if (showPreview()) {
          <svg
            aria-hidden="true"
            xmlns="http://www.w3.org/2000/svg"
            fill="currentColor"
            viewBox="0 0 24 24"
          >
            <path
              fill-rule="evenodd"
              d="M14 4.182A4.136 4.136 0 0 1 16.9 3c1.087 0 2.13.425 2.899 1.182A4.01 4.01 0 0 1 21 7.037c0 1.068-.43 2.092-1.194 2.849L18.5 11.214l-5.8-5.71 1.287-1.31.012-.012Zm-2.717 2.763L6.186 12.13l2.175 2.141 5.063-5.218-2.141-2.108Zm-6.25 6.886-1.98 5.849a.992.992 0 0 0 .245 1.026 1.03 1.03 0 0 0 1.043.242L10.282 19l-5.25-5.168Zm6.954 4.01 5.096-5.186-2.218-2.183-5.063 5.218 2.185 2.15Z"
              clip-rule="evenodd"
            />
          </svg>
        } @else {
          <svg

            aria-hidden="true"
            xmlns="http://www.w3.org/2000/svg"
            fill="none"
            viewBox="0 0 24 24"
          >
            <path
              stroke="currentColor"
              stroke-width="2"
              d="M21 12c0 1.2-4.03 6-9 6s-9-4.8-9-6c0-1.2 4.03-6 9-6s9 4.8 9 6Z"
            />
            <path stroke="currentColor" stroke-width="2" d="M15 12a3 3 0 1 1-6 0 3 3 0 0 1 6 0Z" />
          </svg>
        }
      </button>
    </div>
  </div>

  <div 
    [hidden]="!showPreview()" 
    [innerHTML]="preview()" 
    class="preview">
  </div>
  <textarea
    #editor
    (click)="onClick($event, editor)"
    (input)="onInput(editor)"
    (keyup)="onKeyup($event, editor)"

    [hidden]="showPreview()"

    (focusin)="toggleFocused()"
    (focusout)="toggleFocused()"
    [disabled]="disabled()"
    [placeholder]="placeholder()"
    [rows]="rows()"
    [value]="value()"
  ></textarea>
  <pre>
    selStart: {{ selStart() }}, 
    selEnd: {{ selEnd() }}, 
    caretPos: {{ caretPos() }}
    historyIndex: {{ historyIndex() }}
    history: {{ history() | json }}
  </pre>
</div>
